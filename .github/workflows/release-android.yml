name: Android release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and publish release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Run unit tests and build APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Prepare release APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/bloqueador-de-chamadas-pr-${{ github.event.pull_request.number }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.merge_commit_sha }}"
          name: "PR #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}"
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          generate_release_notes: true
          files: dist/*.apk
